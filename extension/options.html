<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Word Explainer settings</title><link rel="stylesheet" href="options.css"></head>
<body>
<main>
<h1>Word Explainer settings</h1>
<form id="settings">
<label>Pronunciation language<select id="language"><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option><option value="ur-PK">Urdu</option><option value="es-ES">Spanish</option><option value="fr-FR">French</option></select></label>
<label>Speaking speed<input id="rate" type="number" min="0.5" max="2" step="0.1" required></label>
<label>Explanation detail<select id="detail"><option value="short">Short</option><option value="detailed">Detailed</option></select></label>
<label class="check"><input id="showToolbar" type="checkbox">Show actions after highlighting text</label>
<button type="submit">Save settings</button>
<p id="status" role="status"></p>
</form>
<p>ChatGPT opens in a new tab using your browser account. Voice availability depends on your device.</p>
</main>
<script src="options.js"></script>
</body></html>
